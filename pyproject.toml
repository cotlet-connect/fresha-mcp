[project]
name = "fresha-mcp"
version = "1.1.0"
description = "Connect Fresha to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Fresha API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["fresha", "fresha api", "fresha mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/fresha-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=fresha"
Source = "https://github.com/cotlet-connect/fresha-mcp"

[project.scripts]
fresha-mcp = "fresha_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"fresha_agent.py" = "fresha_agent.py"

[tool.hatch.build.targets.sdist]
include = ["fresha_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
